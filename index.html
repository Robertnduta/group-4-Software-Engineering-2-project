<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medflow Hospital - Login</title>
    
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <style>
        body {
            background-color: #f8f9fa;
        }
        .login-container {
            max-width: 400px;
            margin: auto;
            padding-top: 50px;
        }
        .login-card {
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            background: white;
        }
        .btn-primary {
            transition: 0.3s;
        }
        .btn-primary:disabled {
            opacity: 0.7;
        }
        .password-toggle {
            position: relative;
        }
        .password-toggle i {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
        }
        .loading-spinner {
            display: none;
            margin-right: 8px;
        }
    </style>
</head>
<body>

    <div class="container login-container">
        <div class="text-center">
            <h1 class="fw-bold text-primary">MEDFLOW HOSPITAL</h1>
            <p class="text-muted">Your trusted TB specialists</p>
        </div>

        <div class="card login-card p-4">
            <h3 class="text-center text-primary">Login</h3>
            
            <!-- Flash Messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    <div class="alert alert-{{ messages[0][0] }} alert-dismissible fade show" role="alert">
                        {{ messages[0][1] }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                    </div>
                {% endif %}
            {% endwith %}

            <form action="{{ url_for('login') }}" method="POST">
                <div class="mb-3">
                    <label for="email" class="form-label">Email or Username</label>
                    <input type="text" class="form-control" id="email" name="email" required>
                </div>

                <div class="mb-3 password-toggle">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" class="form-control" id="password" name="password" required>
                    <i class="fas fa-eye" onclick="togglePassword()"></i>
                </div>

                <button type="submit" class="btn btn-primary w-100" id="login-btn">
                    <span class="loading-spinner"><i class="fas fa-spinner fa-spin"></i></span>
                    Login
                </button>

                <div class="text-center mt-3">
                    <a href="{{ url_for('register') }}" class="btn btn-link">Don't have an account? Register</a> |
                    <a href="{{ url_for('forgot_password') }}" class="btn btn-link">Forgot Password?</a>
                </div>
            </form>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        function togglePassword() {
            var passwordField = document.getElementById("password");
            var icon = document.querySelector(".password-toggle i");
            if (passwordField.type === "password") {
                passwordField.type = "text";
                icon.classList.remove("fa-eye");
                icon.classList.add("fa-eye-slash");
            } else {
                passwordField.type = "password";
                icon.classList.remove("fa-eye-slash");
                icon.classList.add("fa-eye");
            }
        }

        document.querySelector("form").addEventListener("submit", function() {
            var loginBtn = document.getElementById("login-btn");
            loginBtn.disabled = true;
            document.querySelector(".loading-spinner").style.display = "inline-block";
        });
    </script>

</body>
</html>
